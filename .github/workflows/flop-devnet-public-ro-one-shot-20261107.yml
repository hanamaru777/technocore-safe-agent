name: FLOP Devnet public read-only check 20261107

on:
  push:
    branches:
      - audit/flop-devnet-public-ro-20261107

permissions:
  contents: read

jobs:
  public-get:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Inspect exact official public GET endpoints without credentials
        shell: bash
        run: |
          python3 -I -B - <<'PYCODE'
          import datetime, json, urllib.error, urllib.request
          accounts = {
              "FAUCET": "5HmUuGrkNS5udY1751rahMfGSxspidNNX5ezaozQvu94XgFA",
              "DID": "5HdPNj5xLLRkWVdtWDhc8KHFqEwMFGepkCSffkq8oJABwPb3",
              "MUMU": "5GiwCNqFcgoGfodksuhBHFTPrN6iszXGRD9Y5q3V6nSfF9Xs",
          }
          paths = []
          for name, account in accounts.items():
              paths.append((name+"_BALANCE", "https://explorer.devnet.flop.network/api/accounts/"+account))
              paths.append((name+"_SPEND", "https://explorer.devnet.flop.network/api/accounts/"+account+"/inference-spend"))
          paths.extend([
              ("EXPLORER_HEALTH", "https://explorer.devnet.flop.network/api/health"),
              ("SESSION_OFFERS", "https://explorer.devnet.flop.network/api/session-offers"),
              ("GATEWAY_MODELS", "https://api.flop.network/v1/models"),
              ("GATEWAY_HEALTH", "https://api.flop.network/health"),
              ("FAUCET_CHAIN", "https://faucet.flop.network/chain"),
          ])
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, *args, **kwargs):
                  return None
          opener = urllib.request.build_opener(NoRedirect)
          allowed = set("free reserved balance nonce txCount transactionCount freeBalance free_balance totalSpentRaw total_spent_raw total_count channelCount genesisHash headLag chainHead indexedHead status ready network ss58Prefix rpc total settledSpend settled_spend_raw freeRaw reservedRaw".split())
          def summary(obj):
              fields = {}
              def scan(x, depth=0):
                  if depth >= 5 or len(fields) >= 24:
                      return
                  if type(x) is dict:
                      for k, v in x.items():
                          if k in allowed and type(v) in (str,int,float,bool,type(None)) and len(str(v)) <= 140:
                              fields[k] = v
                          elif type(v) in (dict,list):
                              scan(v,depth+1)
                  elif type(x) is list:
                      for v in x[:2]:
                          scan(v,depth+1)
              scan(obj)
              if type(obj) is dict and type(obj.get("data")) is list:
                  fields["data_length"] = len(obj["data"])
              return fields
          print("START_UTC", datetime.datetime.now(datetime.timezone.utc).isoformat())
          for label, url in paths:
              try:
                  request=urllib.request.Request(url,headers={"Accept":"application/json","User-Agent":"FLOP-Public-Audit/1"},method="GET")
                  with opener.open(request,timeout=8) as response:
                      body=response.read(32769)
                      if len(body)>32768:
                          print(label,"BODY_TOO_LARGE")
                          continue
                      data=json.loads(body)
                      print(label,"HTTP",response.status,json.dumps(summary(data),sort_keys=True))
              except urllib.error.HTTPError as e:
                  print(label,"HTTP",e.code)
              except Exception as e:
                  print(label,"UNAVAILABLE",type(e).__name__)
          print("FLOP_PUBLIC_READ_ONLY_COMPLETE")
          PYCODE

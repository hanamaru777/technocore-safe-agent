              cron_unverified_regulars = 0
              cron_direct_flop_line_matches = 0
              cron_indirect_launch_exhaustively_proven = 'NO'
            }
            processes = @{
              scanned_pids = 100
              flop_commandline_matches = 3
              open_flop_state_write_file_descriptors = 2
              writable_fd_signer = 1
              writable_fd_capture = 1
              writable_fd_tclk = 0
              writable_fd_close1 = 0
              writable_fd_other = 0
              unknown_or_raced_process_fd_objects = 1
              proc_unknown_race = 1
              proc_unknown_permission = 0
              proc_unknown_other = 0
              fd_snapshot_is_durable_fence = 'NO'
            }
            writer_snapshot_complete_and_future_proof = 'NO'
            all_writers_fenced = 'NO'
            external_signer_post_resolved = 'NO'
            both_sqlite_common_epoch = 'NOT_PROVEN'
            no_service_file_or_network_mutation = 'YES'
            oci_retirement = 'STRICT_NO_GO'
            systemd_loaded_status = 'OK'
            systemd_unitfiles_status = 'OK'
            cron_collection_status = 'OK'
            proc_collection_status = 'OK'
          }
          $bytes = [Text.Encoding]::ASCII.GetBytes(($sample | ConvertTo-Json -Compress -Depth 9))
          $summary = [FlopR1062.Guards]::ValidateR1062($bytes)
          if (-not $summary.Contains('FLOP_R1062_READONLY=COLLECTED')) { throw 'R1062_ACCEPT_STOP' }
          if (-not $summary.Contains('FLOP_R1062_WRITABLE_STATE_FDS=2')) { throw 'R1062_FD_RESULT_STOP' }
          if (-not $summary.Contains('FLOP_R1062_OCI_RETIREMENT=STRICT_NO_GO')) { throw 'R1062_RETIRED_STOP' }

          # Even if systemd is unavailable, the remaining read-only proof is
          # explicitly marked PARTIAL. Never convert unknown counts into zero.
          if (-not $summary.Contains('FLOP_R1062_KNOWN_TEMPLATE_MISSING=24')) {
            throw 'R1062_MISSING_TEMPLATE_TEST_STOP'
          }
          if (-not $summary.Contains('FLOP_R1062_WRITABLE_FD_CAPTURE=1')) {
            throw 'R1062_WRITER_CLASS_TEST_STOP'
          }
          # Reject a count that could understate live unknowns, and never allow
          # a source-only schema to certify writer exclusion.
          $sample.units.new_or_unknown_unit_names = 1
          $tamper = [Text.Encoding]::ASCII.GetBytes(($sample | ConvertTo-Json -Compress -Depth 9))
          $blocked = $false
          try { $null = [FlopR1062.Guards]::ValidateR1062($tamper) } catch { $blocked = $true }
          if (-not $blocked) { throw 'R1062_BROKEN_UNIT_SUM_ACCEPTED' }
          $sample.units.new_or_unknown_unit_names = 0
          $sample.systemd_loaded_status = 'TIMEOUT'
          $sample.units.loaded_unit_names = 0
          $sample.units.unitfile_names = 0
          $sample.units.flop_prefixed_total = 0
          $sample.units.flop_dynamic_instance_or_template_names = 0
          $sample.units.expected_template_present = 0
          $sample.units.expected_template_missing = 0
          $sample.units.historical_extra_present = 0
          $sample.units.new_or_unknown_unit_names = 0
          $sample.units.dynamic_actual_instances = 0
          $sample.units.signer_route_template_present = 0
          $partialBytes = [Text.Encoding]::ASCII.GetBytes(($sample | ConvertTo-Json -Compress -Depth 9))
          $partialSummary = [FlopR1062.Guards]::ValidateR1062($partialBytes)
          if (-not $partialSummary.Contains('FLOP_R1062_READONLY=PARTIAL')) { throw 'R1062_PARTIAL_BYPASS' }
          if (-not $partialSummary.Contains('FLOP_R1062_FLOP_UNITS=UNVERIFIED')) { throw 'R1062_UNVERIFIED_BYPASS' }
          $sample.systemd_loaded_status = 'SURPRISE'
          $malformed = [Text.Encoding]::ASCII.GetBytes(($sample | ConvertTo-Json -Compress -Depth 9))
          $blocked = $false
          try { $null = [FlopR1062.Guards]::ValidateR1062($malformed) } catch { $blocked = $true }
          if (-not $blocked) { throw 'R1062_INVALID_STATUS_ACCEPTED' }
          $sample.systemd_loaded_status = 'OK'
          $sample.units.loaded_unit_names = 3
          $sample.units.unitfile_names = 4
          $sample.units.flop_prefixed_total = 3
          $sample.units.flop_dynamic_instance_or_template_names = 1
          $sample.units.expected_template_present = 3
          $sample.units.expected_template_missing = 24
          $sample.units.signer_route_template_present = 1
          $sample.all_writers_fenced = 'YES'
          $bad = [Text.Encoding]::ASCII.GetBytes(($sample | ConvertTo-Json -Compress -Depth 9))
          $blocked = $false
          try { $null = [FlopR1062.Guards]::ValidateR1062($bad) } catch { $blocked = $true }
          if (-not $blocked) { throw 'R1062_FAKE_FENCE_ACCEPTED' }
          Write-Host 'WINDOWS_PS51_R1062_OFFLINE=PASS'

          $fn = $ast.Find({
            param($node)
            $node -is [System.Management.Automation.Language.FunctionDefinitionAst] -and
              $node.Name -eq 'Get-R1062GuestStop'
          }, $true)
          if ($null -eq $fn) { throw 'R1062_GUEST_STOP_FUNCTION_MISSING' }
          Invoke-Expression $fn.Extent.Text
          foreach ($item in @('PREFLIGHT_SCOPE', 'PREFLIGHT_HEAD', 'UNITS',
                               'CRON', 'PROCESS', 'REPORT', 'GUARD')) {
            $raw = [Text.Encoding]::ASCII.GetBytes("FLOP_R1062_STOP=$($item)_STOP" + [char]10)
            $seen = Get-R1062GuestStop $raw
            if ($seen -cne ('GUEST_' + $item + '_STOP')) { throw 'R1062_ENUM_REJECTED' }
          }
          $bad = [Text.Encoding]::ASCII.GetBytes("FLOP_R1062_STOP=UNITS_STOP" + [char]10 + "private")
          if ((Get-R1062GuestStop $bad) -cne 'GUEST_UNRECOGNIZED_STOP') {
            throw 'R1062_STOP_CONTENT_LEAK'
          }
          $bad = [Text.Encoding]::ASCII.GetBytes("FLOP_R1062_STOP=FENCE_GO_STOP" + [char]10)
          if ((Get-R1062GuestStop $bad) -cne 'GUEST_UNRECOGNIZED_STOP') {
            throw 'R1062_UNRECOGNIZED_ACCEPT'
          }
          Write-Host 'WINDOWS_PS51_R1062_FIXED_STAGE_DIAGNOSTIC=PASS'

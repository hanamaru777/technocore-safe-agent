              $sample.descriptors.all_writers_fenced=$true}
            if ($field -eq 'count') {$prior=$sample.units.expected_source_templates;
              $sample.units.expected_source_templates=26}
            $denied=$false
            try {$null=Read-R1102Report (Bytes $sample)} catch {$denied=$true}
            if ($field -eq 'signed_g4') {$sample.signed_g4=$prior}
            if ($field -eq 'result') {$sample.result=$prior}
            if ($field -eq 'writable') {$sample.descriptors.writable_descriptors=$prior}
            if ($field -eq 'bool') {$sample.descriptors.all_writers_fenced=$prior}
            if ($field -eq 'count') {$sample.units.expected_source_templates=$prior}
            if (-not $denied) {throw 'R1102_UNSAFE_RECEIPT_ACCEPTED'}
          }
          Write-Host 'R1102_PS51_LIVE_SURVEY_SCHEMA_PASS'

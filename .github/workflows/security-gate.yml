name: security-gate

on:
  push:
    branches:
      - main
      - "security/**"
      - "codex/r1107-full-migration-readiness-onepass-v1"
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout full history
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up pinned local tclk parser runtime
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Install pinned tclk parser
        run: npm ci --ignore-scripts

      - name: Install uv
        run: python -m pip install --disable-pip-version-check uv

      - name: Sync locked dependencies
        run: uv sync --frozen --group dev --extra oracle-signer --extra discord

      - name: R1089 targeted transport and preservation regression before full suite
        if: github.ref != 'refs/heads/codex/r1107-full-migration-readiness-onepass-v1'
        run: uv run pytest -q tests/test_r1089_migration.py tests/test_r1063_release_gates.py tests/test_r1084_offhost_ciphertext_stream.py tests/test_r1086_k137_disarmed_stream_restore.py

      - name: R1107 targeted gates and directly reused regression before single full suite
        if: github.ref == 'refs/heads/codex/r1107-full-migration-readiness-onepass-v1'
        run: uv run pytest -q tests/test_r1107_readiness.py tests/test_r1103_g5_receipt_consistency.py tests/test_r1104_g1g4_coverage_consistency.py tests/test_r1106_technocore_export_readonly.py

      - name: Run tests
        run: uv run pytest -q

      - name: Scan tracked files for secrets
        run: PYTHONPATH=src uv run python -m flop_agent.cli secret-scan

      - name: Scan reachable Git history for secrets
        run: PYTHONPATH=src uv run python -m flop_agent.cli history-secret-scan

  windows-keygen-regression:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Test R1066 two-host preflight with synthetic metadata and mocked SSH only
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          python -m pip install --disable-pip-version-check pytest==9.1.1 cryptography==50.0.1
          if ($LASTEXITCODE -ne 0) { throw 'PYTEST_INSTALL_STOP' }
          python -m pytest -q tests/test_r1066_preflight.py
          if ($LASTEXITCODE -ne 0) { throw 'R1066_TEST_STOP' }
          python -m pytest -q tests/test_r1085_windows_offhost_sink.py
          if ($LASTEXITCODE -ne 0) { throw 'R1085_TEST_STOP' }
          python -m pytest -q tests/test_r1088_windows_ciphertext_custody.py
          if ($LASTEXITCODE -ne 0) { throw 'R1066_TEST_STOP' }

      - name: Test R1089 binary custody and authenticated owner transport offline
        shell: powershell
        run: |
          python -m pytest -q tests/test_r1089_migration.py
          if ($LASTEXITCODE -ne 0) { throw 'R1089_TEST_STOP' }

      - name: Test R1107 native PS5.1 dry-run gate without hosts or secrets
        if: github.ref == 'refs/heads/codex/r1107-full-migration-readiness-onepass-v1'
        shell: powershell
        run: |
          python -m pip install --disable-pip-version-check httpx==0.28.1
          if ($LASTEXITCODE -ne 0) { throw 'READONLY_TEST_DEPENDENCY_STOP' }
          if (-not (Test-Path '.venv\Scripts\python.exe')) {
            python -m venv --system-site-packages .venv
            if ($LASTEXITCODE -ne 0) { throw 'LOCAL_TEST_ENV_STOP' }
          }
          $env:PYTHONPATH = 'src'
          python -m pytest -q tests/test_r1107_readiness.py
          if ($LASTEXITCODE -ne 0) { throw 'R1107_TEST_STOP' }

      - name: Prove bootstrap remote shell source is LF-only
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          if ($PSVersionTable.PSVersion.Major -ne 5) {
            throw "Expected Windows PowerShell 5.1, got $($PSVersionTable.PSVersion)"
          }
          $bootstrapPath = Join-Path $env:GITHUB_WORKSPACE 'packaging\windows\bootstrap-technocore-ci-readonly-path.ps1'
          $bootstrapBytes = [IO.File]::ReadAllBytes($bootstrapPath)
          if ($bootstrapBytes -contains [byte]13) {
            throw 'bootstrap contains CR bytes; remote Bash payload is not LF-only'
          }
          $bootstrapText = [IO.File]::ReadAllText($bootstrapPath)
          if ($bootstrapText -notmatch 'set -euo pipefail') {
            throw 'remote Bash preflight marker missing'
          }
          Write-Host 'WINDOWS_PS51_REMOTE_SHELL_LF_REGRESSION=PASS'

      - name: Prove Windows PowerShell 5.1 native argv forwarding
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          if ($PSVersionTable.PSVersion.Major -ne 5) {
            throw "Expected Windows PowerShell 5.1, got $($PSVersionTable.PSVersion)"
          }
          $bootstrapPath = Join-Path $env:GITHUB_WORKSPACE 'packaging\windows\bootstrap-technocore-ci-readonly-path.ps1'
          $tokens = $null
          $parseErrors = $null
          $ast = [System.Management.Automation.Language.Parser]::ParseFile(
            $bootstrapPath,
            [ref]$tokens,
            [ref]$parseErrors
          )
          if ($parseErrors.Count -ne 0) {
            throw 'bootstrap PowerShell parse failed'
          }
          $wrapper = $ast.Find({
            param($node)
            $node -is [System.Management.Automation.Language.FunctionDefinitionAst] -and
              $node.Name -eq 'Invoke-CheckedQuiet'
          }, $true)
          if ($null -eq $wrapper) {
            throw 'Invoke-CheckedQuiet function missing'
          }
          function Stop-Stage([string]$Reason) {
            throw "STOP_$Reason"
          }
          Invoke-Expression $wrapper.Extent.Text
          $probe = Join-Path $env:RUNNER_TEMP 'technocore-native-argv-probe.ps1'
          @'
          param(
            [string]$First,
            [string]$Second,
            [string]$Third
          )
          if ($First -ne 'alpha') { exit 41 }
          if ($Second -ne 'beta gamma') { exit 42 }
          if ($Third -ne 'delta') { exit 43 }
          exit 0
          '@ | Set-Content -LiteralPath $probe -Encoding ASCII
          $powershellExe = (Get-Command powershell.exe).Source
          Invoke-CheckedQuiet $powershellExe @(
            '-NoProfile',
            '-NonInteractive',
            '-File', $probe,
            'alpha',
            'beta gamma',
            'delta'
          ) 'NATIVE_ARGV_FORWARDING'
          Write-Host 'WINDOWS_PS51_NATIVE_ARGV_FORWARDING=PASS'

      - name: Prove Windows PowerShell 5.1 benign native stderr handling
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          if ($PSVersionTable.PSVersion.Major -ne 5) {
            throw "Expected Windows PowerShell 5.1, got $($PSVersionTable.PSVersion)"
          }
          $bootstrapPath = Join-Path $env:GITHUB_WORKSPACE 'packaging\windows\bootstrap-technocore-ci-readonly-path.ps1'
          $tokens = $null
          $parseErrors = $null
          $ast = [System.Management.Automation.Language.Parser]::ParseFile(
            $bootstrapPath,
            [ref]$tokens,
            [ref]$parseErrors
          )
          if ($parseErrors.Count -ne 0) {
            throw 'bootstrap PowerShell parse failed'
          }
          $capture = $ast.Find({
            param($node)
            $node -is [System.Management.Automation.Language.FunctionDefinitionAst] -and
              $node.Name -eq 'Invoke-CapturedNative'
          }, $true)
          if ($null -eq $capture) {
            throw 'Invoke-CapturedNative function missing'
          }
          function Stop-Stage([string]$Reason) {
            throw "STOP_$Reason"
          }
          Invoke-Expression $capture.Extent.Text
          $powershellExe = (Get-Command powershell.exe).Source

          $successProbe = Join-Path $env:RUNNER_TEMP 'technocore-native-stderr-success.ps1'
          @'
          [Console]::Out.WriteLine('expected-stdout')
          [Console]::Error.WriteLine('benign-stderr')
          exit 0
          '@ | Set-Content -LiteralPath $successProbe -Encoding ASCII
          $successOutput = @(
            Invoke-CapturedNative $powershellExe @(
              '-NoProfile',
              '-NonInteractive',
              '-File', $successProbe
            ) 'BENIGN_STDERR_SUCCESS'
          )
          if ($successOutput -notcontains 'expected-stdout') {
            throw 'captured stdout missing'
          }

          $failureProbe = Join-Path $env:RUNNER_TEMP 'technocore-native-stderr-failure.ps1'
          @'
          [Console]::Error.WriteLine('expected-failure-stderr')
          exit 23
          '@ | Set-Content -LiteralPath $failureProbe -Encoding ASCII
          $failedClosed = $false
          try {
            $null = Invoke-CapturedNative $powershellExe @(
              '-NoProfile',
              '-NonInteractive',
              '-File', $failureProbe
            ) 'NONZERO_EXIT'
          } catch {
            if ($_.Exception.Message -eq 'STOP_NONZERO_EXIT') {
              $failedClosed = $true
            } else {
              throw
            }
          }
          if (-not $failedClosed) {
            throw 'nonzero native exit did not fail closed'
          }
          $global:LASTEXITCODE = 0
          Write-Host 'WINDOWS_PS51_NATIVE_STDERR_HANDLING=PASS'

      - name: Prove Windows PowerShell 5.1 non-interactive key generation
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          if ($PSVersionTable.PSVersion.Major -ne 5) {
            throw "Expected Windows PowerShell 5.1, got $($PSVersionTable.PSVersion)"
          }
          $sshKeygen = (Get-Command ssh-keygen.exe).Source
          $keyPath = Join-Path $env:RUNNER_TEMP 'technocore-ci-actions-regression'
          & .\packaging\windows\new-technocore-ci-keypair.ps1 `
            -SshKeygenExe $sshKeygen `
            -KeyPath $keyPath `
            -TimeoutMilliseconds 10000
          if (-not (Test-Path -LiteralPath $keyPath -PathType Leaf)) {
            throw 'private key missing'
          }
          if (-not (Test-Path -LiteralPath "$keyPath.pub" -PathType Leaf)) {
            throw 'public key missing'
          }
          $derived = (& $sshKeygen -y -f $keyPath 2>$null).Trim()
          $public = (Get-Content -LiteralPath "$keyPath.pub" -Raw).Trim()
          if (($derived -split '\s+')[1] -ne ($public -split '\s+')[1]) {
            throw 'keypair mismatch'
          }
          Write-Host 'WINDOWS_PS51_CI_KEYGEN_REGRESSION=PASS'

      - name: Validate R1058 immutable R987 Windows witness offline
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          if ($PSVersionTable.PSVersion.Major -ne 5) { throw 'PS51_REQUIRED' }
          $path = Join-Path $env:GITHUB_WORKSPACE 'packaging\windows\r1058_oci_writer_admission_one_shot_readonly.ps1'
          $tokens = $null
          $parseErrors = $null
          $null = [System.Management.Automation.Language.Parser]::ParseFile(
            $path, [ref]$tokens, [ref]$parseErrors
          )
          if ($parseErrors.Count -ne 0) { throw 'R1058_PS_PARSE_STOP' }
          $text = [IO.File]::ReadAllText($path)
          $pattern = "-TypeDefinition @'\r?\n(?<src>.*?)\r?\n'@"
          $match = [Text.RegularExpressions.Regex]::Match(
            $text, $pattern, [Text.RegularExpressions.RegexOptions]::Singleline
          )
          if (-not $match.Success) { throw 'R1058_CSHARP_SOURCE_STOP' }
          Add-Type -ReferencedAssemblies 'System.dll','System.Core.dll','System.Security.dll','System.Web.Extensions.dll' -TypeDefinition $match.Groups['src'].Value
          $original = 'ec4bc4892d40cdd2a03e102faa44d72c89e01b99'
          $sample = @{
            schema_version = 1
            original_source_head = $original
            units = @{
              loaded_unit_names = 3
              unitfile_names = 4
              flop_prefixed_total = 3
              flop_dynamic_instance_or_template_names = 1
              dynamic_or_manual_instance_proven_absent = 'NO'
              unprefixed_unit_exec_targets_proven_exhaustive = 'NO'
              unit_restart_or_reboot_fence = 'NOT_PROVEN'
            }
            cron = @{
              cron_regular_read = 4
              cron_unverified_entries = 1
              cron_direct_flop_line_matches = 0
              cron_indirect_launch_exhaustively_proven = 'NO'
            }
            processes = @{
              scanned_pids = 100
              flop_commandline_matches = 3
              open_flop_state_write_file_descriptors = 2
              unknown_or_raced_process_fd_objects = 1
              fd_snapshot_is_durable_fence = 'NO'
            }
            writer_snapshot_complete_and_future_proof = 'NO'
            all_writers_fenced = 'NO'
            external_signer_post_resolved = 'NO'
            both_sqlite_common_epoch = 'NOT_PROVEN'
            no_service_file_or_network_mutation = 'YES'
            oci_retirement = 'STRICT_NO_GO'
          }
          $bytes = [Text.Encoding]::ASCII.GetBytes(($sample | ConvertTo-Json -Compress -Depth 9))
          $summary = [FlopR1058.Guards]::ValidateR1058($bytes)
          if (-not $summary.Contains('FLOP_R1058_READONLY=PASS')) { throw 'R1058_ACCEPT_STOP' }
          if (-not $summary.Contains('FLOP_R1058_WRITABLE_STATE_FDS=2')) { throw 'R1058_FD_RESULT_STOP' }
          if (-not $summary.Contains('FLOP_R1058_OCI_RETIREMENT=STRICT_NO_GO')) { throw 'R1058_RETIRED_STOP' }
          $sample.all_writers_fenced = 'YES'
          $bad = [Text.Encoding]::ASCII.GetBytes(($sample | ConvertTo-Json -Compress -Depth 9))
          $blocked = $false
          try { $null = [FlopR1058.Guards]::ValidateR1058($bad) } catch { $blocked = $true }
          if (-not $blocked) { throw 'R1058_FAKE_FENCE_ACCEPTED' }
          Write-Host 'WINDOWS_PS51_R1058_OFFLINE=PASS'

      - name: Validate R1059 immutable R987 Windows witness offline
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          if ($PSVersionTable.PSVersion.Major -ne 5) { throw 'PS51_REQUIRED' }
          $path = Join-Path $env:GITHUB_WORKSPACE 'packaging\windows\r1059_oci_writer_stage_one_shot_readonly.ps1'
          $tokens = $null
          $parseErrors = $null
          $ast = [System.Management.Automation.Language.Parser]::ParseFile(
            $path, [ref]$tokens, [ref]$parseErrors
          )
          if ($parseErrors.Count -ne 0) { throw 'R1059_PS_PARSE_STOP' }
          $text = [IO.File]::ReadAllText($path)
          $pattern = "-TypeDefinition @'\r?\n(?<src>.*?)\r?\n'@"
          $match = [Text.RegularExpressions.Regex]::Match(
            $text, $pattern, [Text.RegularExpressions.RegexOptions]::Singleline
          )
          if (-not $match.Success) { throw 'R1059_CSHARP_SOURCE_STOP' }
          Add-Type -ReferencedAssemblies 'System.dll','System.Core.dll','System.Security.dll','System.Web.Extensions.dll' -TypeDefinition $match.Groups['src'].Value
          $original = 'ec4bc4892d40cdd2a03e102faa44d72c89e01b99'
          $sample = @{
            schema_version = 1
            original_source_head = $original
            units = @{
              loaded_unit_names = 3
              unitfile_names = 4
              flop_prefixed_total = 3
              flop_dynamic_instance_or_template_names = 1
              dynamic_or_manual_instance_proven_absent = 'NO'
              unprefixed_unit_exec_targets_proven_exhaustive = 'NO'
              unit_restart_or_reboot_fence = 'NOT_PROVEN'
            }
            cron = @{
              cron_regular_read = 4
              cron_unverified_entries = 1
              cron_direct_flop_line_matches = 0
              cron_indirect_launch_exhaustively_proven = 'NO'
            }
            processes = @{
              scanned_pids = 100
              flop_commandline_matches = 3
              open_flop_state_write_file_descriptors = 2
              unknown_or_raced_process_fd_objects = 1
              fd_snapshot_is_durable_fence = 'NO'
            }
            writer_snapshot_complete_and_future_proof = 'NO'
            all_writers_fenced = 'NO'
            external_signer_post_resolved = 'NO'
            both_sqlite_common_epoch = 'NOT_PROVEN'
            no_service_file_or_network_mutation = 'YES'
            oci_retirement = 'STRICT_NO_GO'
          }
          $bytes = [Text.Encoding]::ASCII.GetBytes(($sample | ConvertTo-Json -Compress -Depth 9))
          $summary = [FlopR1059.Guards]::ValidateR1059($bytes)
          if (-not $summary.Contains('FLOP_R1059_READONLY=PASS')) { throw 'R1059_ACCEPT_STOP' }
          if (-not $summary.Contains('FLOP_R1059_WRITABLE_STATE_FDS=2')) { throw 'R1059_FD_RESULT_STOP' }
          if (-not $summary.Contains('FLOP_R1059_OCI_RETIREMENT=STRICT_NO_GO')) { throw 'R1059_RETIRED_STOP' }
          $sample.all_writers_fenced = 'YES'
          $bad = [Text.Encoding]::ASCII.GetBytes(($sample | ConvertTo-Json -Compress -Depth 9))
          $blocked = $false
          try { $null = [FlopR1059.Guards]::ValidateR1059($bad) } catch { $blocked = $true }
          if (-not $blocked) { throw 'R1059_FAKE_FENCE_ACCEPTED' }
          Write-Host 'WINDOWS_PS51_R1059_OFFLINE=PASS'

          $fn = $ast.Find({
            param($node)
            $node -is [System.Management.Automation.Language.FunctionDefinitionAst] -and
              $node.Name -eq 'Get-R1059GuestStop'
          }, $true)
          if ($null -eq $fn) { throw 'R1059_GUEST_STOP_FUNCTION_MISSING' }
          Invoke-Expression $fn.Extent.Text
          foreach ($item in @('PREFLIGHT_SCOPE', 'PREFLIGHT_HEAD', 'UNITS',
                               'CRON', 'PROCESS', 'REPORT', 'GUARD')) {
            $raw = [Text.Encoding]::ASCII.GetBytes("FLOP_R1059_STOP=$($item)_STOP" + [char]10)
            $seen = Get-R1059GuestStop $raw
            if ($seen -cne ('GUEST_' + $item + '_STOP')) { throw 'R1059_ENUM_REJECTED' }
          }
          $bad = [Text.Encoding]::ASCII.GetBytes("FLOP_R1059_STOP=UNITS_STOP" + [char]10 + "private")
          if ((Get-R1059GuestStop $bad) -cne 'GUEST_UNRECOGNIZED_STOP') {
            throw 'R1059_STOP_CONTENT_LEAK'
          }
          $bad = [Text.Encoding]::ASCII.GetBytes("FLOP_R1059_STOP=FENCE_GO_STOP" + [char]10)
          if ((Get-R1059GuestStop $bad) -cne 'GUEST_UNRECOGNIZED_STOP') {
            throw 'R1059_UNRECOGNIZED_ACCEPT'
          }
          Write-Host 'WINDOWS_PS51_R1059_FIXED_STAGE_DIAGNOSTIC=PASS'

      - name: Validate R1061 immutable R987 Windows witness offline
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          if ($PSVersionTable.PSVersion.Major -ne 5) { throw 'PS51_REQUIRED' }
          $path = Join-Path $env:GITHUB_WORKSPACE 'packaging\windows\r1061_partial_writer_witness_one_shot_readonly.ps1'
          $tokens = $null
          $parseErrors = $null
          $ast = [System.Management.Automation.Language.Parser]::ParseFile(
            $path, [ref]$tokens, [ref]$parseErrors
          )
          if ($parseErrors.Count -ne 0) { throw 'R1061_PS_PARSE_STOP' }
          $text = [IO.File]::ReadAllText($path)
          $pattern = "-TypeDefinition @'\r?\n(?<src>.*?)\r?\n'@"
          $match = [Text.RegularExpressions.Regex]::Match(
            $text, $pattern, [Text.RegularExpressions.RegexOptions]::Singleline
          )
          if (-not $match.Success) { throw 'R1061_CSHARP_SOURCE_STOP' }
          Add-Type -ReferencedAssemblies 'System.dll','System.Core.dll','System.Security.dll','System.Web.Extensions.dll' -TypeDefinition $match.Groups['src'].Value
          $original = 'ec4bc4892d40cdd2a03e102faa44d72c89e01b99'
          $sample = @{
            schema_version = 1
            original_source_head = $original
            units = @{
              loaded_unit_names = 3
              unitfile_names = 4
              flop_prefixed_total = 3
              flop_dynamic_instance_or_template_names = 1
              dynamic_or_manual_instance_proven_absent = 'NO'
              unprefixed_unit_exec_targets_proven_exhaustive = 'NO'
              unit_restart_or_reboot_fence = 'NOT_PROVEN'
            }
            cron = @{
              cron_regular_read = 4
              cron_unverified_entries = 1
              cron_direct_flop_line_matches = 0
              cron_indirect_launch_exhaustively_proven = 'NO'
            }
            processes = @{
              scanned_pids = 100
              flop_commandline_matches = 3
              open_flop_state_write_file_descriptors = 2
              unknown_or_raced_process_fd_objects = 1
              fd_snapshot_is_durable_fence = 'NO'
            }
            writer_snapshot_complete_and_future_proof = 'NO'
            all_writers_fenced = 'NO'
            external_signer_post_resolved = 'NO'
            both_sqlite_common_epoch = 'NOT_PROVEN'
            no_service_file_or_network_mutation = 'YES'
            oci_retirement = 'STRICT_NO_GO'
            systemd_loaded_status = 'OK'
            systemd_unitfiles_status = 'OK'
            cron_collection_status = 'OK'
            proc_collection_status = 'OK'
          }
          $bytes = [Text.Encoding]::ASCII.GetBytes(($sample | ConvertTo-Json -Compress -Depth 9))
          $summary = [FlopR1061.Guards]::ValidateR1061($bytes)
          if (-not $summary.Contains('FLOP_R1061_READONLY=COLLECTED')) { throw 'R1061_ACCEPT_STOP' }
          if (-not $summary.Contains('FLOP_R1061_WRITABLE_STATE_FDS=2')) { throw 'R1061_FD_RESULT_STOP' }
          if (-not $summary.Contains('FLOP_R1061_OCI_RETIREMENT=STRICT_NO_GO')) { throw 'R1061_RETIRED_STOP' }

          # Even if systemd is unavailable, the remaining read-only proof is
          # explicitly marked PARTIAL. Never convert unknown counts into zero.
          $sample.systemd_loaded_status = 'TIMEOUT'
          $sample.units.loaded_unit_names = 0
          $sample.units.unitfile_names = 0
          $sample.units.flop_prefixed_total = 0
          $sample.units.flop_dynamic_instance_or_template_names = 0
          $partialBytes = [Text.Encoding]::ASCII.GetBytes(($sample | ConvertTo-Json -Compress -Depth 9))
          $partialSummary = [FlopR1061.Guards]::ValidateR1061($partialBytes)
          if (-not $partialSummary.Contains('FLOP_R1061_READONLY=PARTIAL')) { throw 'R1061_PARTIAL_BYPASS' }
          if (-not $partialSummary.Contains('FLOP_R1061_FLOP_UNITS=UNVERIFIED')) { throw 'R1061_UNVERIFIED_BYPASS' }
          $sample.systemd_loaded_status = 'SURPRISE'
          $malformed = [Text.Encoding]::ASCII.GetBytes(($sample | ConvertTo-Json -Compress -Depth 9))
          $blocked = $false
          try { $null = [FlopR1061.Guards]::ValidateR1061($malformed) } catch { $blocked = $true }
          if (-not $blocked) { throw 'R1061_INVALID_STATUS_ACCEPTED' }
          $sample.systemd_loaded_status = 'OK'
          $sample.units.loaded_unit_names = 3
          $sample.units.unitfile_names = 4
          $sample.units.flop_prefixed_total = 3
          $sample.units.flop_dynamic_instance_or_template_names = 1
          $sample.all_writers_fenced = 'YES'
          $bad = [Text.Encoding]::ASCII.GetBytes(($sample | ConvertTo-Json -Compress -Depth 9))
          $blocked = $false
          try { $null = [FlopR1061.Guards]::ValidateR1061($bad) } catch { $blocked = $true }
          if (-not $blocked) { throw 'R1061_FAKE_FENCE_ACCEPTED' }
          Write-Host 'WINDOWS_PS51_R1061_OFFLINE=PASS'

          $fn = $ast.Find({
            param($node)
            $node -is [System.Management.Automation.Language.FunctionDefinitionAst] -and
              $node.Name -eq 'Get-R1061GuestStop'
          }, $true)
          if ($null -eq $fn) { throw 'R1061_GUEST_STOP_FUNCTION_MISSING' }
          Invoke-Expression $fn.Extent.Text
          foreach ($item in @('PREFLIGHT_SCOPE', 'PREFLIGHT_HEAD', 'UNITS',
                               'CRON', 'PROCESS', 'REPORT', 'GUARD')) {
            $raw = [Text.Encoding]::ASCII.GetBytes("FLOP_R1061_STOP=$($item)_STOP" + [char]10)
            $seen = Get-R1061GuestStop $raw
            if ($seen -cne ('GUEST_' + $item + '_STOP')) { throw 'R1061_ENUM_REJECTED' }
          }
          $bad = [Text.Encoding]::ASCII.GetBytes("FLOP_R1061_STOP=UNITS_STOP" + [char]10 + "private")

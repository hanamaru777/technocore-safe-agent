name: production-control-path-bootstrap-proof

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-control-path-bootstrap-proof
  cancel-in-progress: false

jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate fixed bootstrap invocation and prepare dedicated SSH credential
        shell: bash
        env:
          RUN_REPOSITORY: ${{ github.repository }}
          RUN_REF: ${{ github.ref }}
          PROD_HOST: ${{ secrets.TECHNOCORE_CI_HOST }}
          PROD_SSH_KEY: ${{ secrets.TECHNOCORE_CI_SSH_KEY }}
          PROD_KNOWN_HOSTS: ${{ secrets.TECHNOCORE_CI_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          [[ "$RUN_REPOSITORY" == "hanamaru777/technocore-safe-agent" ]] || exit 20
          [[ "$RUN_REF" == "refs/heads/main" ]] || exit 21
          [[ -n "$PROD_HOST" && -n "$PROD_SSH_KEY" && -n "$PROD_KNOWN_HOSTS" ]] || exit 22

          umask 077
          printf '%s\n' "$PROD_SSH_KEY" > "$RUNNER_TEMP/technocore-ci-key"
          printf '%s\n' "$PROD_KNOWN_HOSTS" > "$RUNNER_TEMP/technocore-ci-known-hosts"
          chmod 600 "$RUNNER_TEMP/technocore-ci-key" "$RUNNER_TEMP/technocore-ci-known-hosts"

      - name: Run fixed bootstrap-only Production proof
        shell: bash
        env:
          PROD_HOST: ${{ secrets.TECHNOCORE_CI_HOST }}
        run: |
          set -euo pipefail
          NONCE="$(openssl rand -hex 16)"
          ERR="$RUNNER_TEMP/technocore-ci-bootstrap-ssh.err"

          set +e
          PROOF_JSON="$(
            ssh -T \
              -i "$RUNNER_TEMP/technocore-ci-key" \
              -o BatchMode=yes \
              -o IdentitiesOnly=yes \
              -o StrictHostKeyChecking=yes \
              -o UserKnownHostsFile="$RUNNER_TEMP/technocore-ci-known-hosts" \
              -o ConnectTimeout=10 \
              -o LogLevel=ERROR \
              "technocore-ci@$PROD_HOST" \
              "bootstrap $NONCE" \
              2>"$ERR"
          )"
          RC=$?
          set -e

          if [[ "$RC" -ne 0 ]]; then
            echo "CI_BOOTSTRAP_CONTROL_PATH_PROOF=FAILED"
            exit 23
          fi

          PROOF_JSON="$PROOF_JSON" python3 - <<'PY'
          import json
          import os

          try:
              value = json.loads(os.environ["PROOF_JSON"])
          except Exception as error:
              raise SystemExit("invalid fixed bootstrap proof response") from error

          required = {
              "status",
              "authenticated",
              "ready",
              "binding_capable",
              "quota_independent",
              "verified_at",
              "context_sha256",
          }
          if set(value) != required:
              raise SystemExit("unexpected bootstrap proof schema")
          if value["status"] != "BOOTSTRAP_PROOF":
              raise SystemExit("bootstrap proof did not pass")
          if value["authenticated"] is not True or value["ready"] is not True:
              raise SystemExit("bootstrap path authentication/readiness missing")
          if value["binding_capable"] is not False:
              raise SystemExit("bootstrap proof must remain non-binding")
          if value["quota_independent"] is not True:
              raise SystemExit("unexpected quota classification")
          digest = value["context_sha256"]
          if not isinstance(digest, str) or len(digest) != 64:
              raise SystemExit("invalid bootstrap context digest")

          print("CI_BOOTSTRAP_CONTROL_PATH_PROOF=PASS")
          print("CONTROL_PATH_REDUNDANCY_GATE_CHANGED=NO")
          PY

      - name: Destroy runner-side SSH material
        if: always()
        shell: bash
        run: |
          rm -f \
            "$RUNNER_TEMP/technocore-ci-key" \
            "$RUNNER_TEMP/technocore-ci-known-hosts" \
            "$RUNNER_TEMP/technocore-ci-bootstrap-ssh.err"

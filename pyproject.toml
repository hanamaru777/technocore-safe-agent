[project]
name = "technocore-safe-agent"
version = "0.1.0"
description = "Safe, evidence-first FLOP / Technocore agent foundation"
requires-python = ">=3.12"
dependencies = ["cryptography>=45,<51", "httpx>=0.28,<1"]

[project.optional-dependencies]
discord = ["discord.py>=2.4,<3"]
oracle-signer = ["oci>=2.0,<3"]

[dependency-groups]
dev = ["pytest>=8,<10"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.uv]
package = false
link-mode = "copy"

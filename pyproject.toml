[project]
name = "flop-airdrop-agent"
version = "0.1.0"
description = "Safe, evidence-first FLOP / Technocore agent foundation"
requires-python = ">=3.12"
dependencies = ["httpx>=0.28,<1"]

[dependency-groups]
dev = ["pytest>=8,<10"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.uv]
package = false
link-mode = "copy"
